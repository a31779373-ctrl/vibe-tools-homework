<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宮格打地鼠</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .instruction {
            color: #666;
            margin-bottom: 20px;
        }
        .info-board {
            display: flex;
            justify-content: center;
            gap: 50px;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .score-text { color: #d9534f; }
        .time-text { color: #5bc0de; }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background-color: #8b4513;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .hole {
            background-color: #654321;
            border-radius: 50%;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .mole {
            width: 80%;
            height: 80%;
            /* 改為讀取 assets 資料夾裡面的圖片 */
            background-image: url('assets/mole.jpg.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 50% 50% 10% 10%;
            position: absolute;
            bottom: -100%; /* Hide inside the hole */
            transition: bottom 0.1s ease-out;
            cursor: pointer;
        }
        .mole.up {
            bottom: 0; /* Pop up */
        }
        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <h1>打地鼠遊戲 🐹</h1>
    <p class="instruction">點擊出現的地鼠來得分！準備好了嗎？</p>
    
    <div class="info-board">
        <div>分數: <span id="score" class="score-text">0</span></div>
        <div>時間: <span id="time" class="time-text">30</span> 秒</div>
    </div>

    <div class="game-board">
        <div class="hole"><div class="mole" id="mole-0"></div></div>
        <div class="hole"><div class="mole" id="mole-1"></div></div>
        <div class="hole"><div class="mole" id="mole-2"></div></div>
        <div class="hole"><div class="mole" id="mole-3"></div></div>
        <div class="hole"><div class="mole" id="mole-4"></div></div>
        <div class="hole"><div class="mole" id="mole-5"></div></div>
        <div class="hole"><div class="mole" id="mole-6"></div></div>
        <div class="hole"><div class="mole" id="mole-7"></div></div>
        <div class="hole"><div class="mole" id="mole-8"></div></div>
    </div>

    <button id="start-btn" onclick="startGame()">開始遊戲</button>

    <script>
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        let moleInterval;
        let currentMole = null;
        let isPlaying = false;

        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const moles = document.querySelectorAll('.mole');

        function randomHole() {
            const index = Math.floor(Math.random() * moles.length);
            return moles[index];
        }

        function showMole() {
            if (currentMole) {
                currentMole.classList.remove('up');
            }
            currentMole = randomHole();
            currentMole.classList.add('up');
        }

        function whack(e) {
            if (!isPlaying) return;
            if (e.target.classList.contains('up')) {
                score++;
                scoreDisplay.textContent = score;
                e.target.classList.remove('up');
                currentMole = null; // Prevent double clicking on the same mole
            }
        }

        // Support both mouse and touch for mobile
        moles.forEach(mole => {
            mole.addEventListener('mousedown', whack);
            mole.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent triggering mouse event after touch
                whack(e);
            });
        });

        function startGame() {
            // Reset state
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            startBtn.disabled = true;
            isPlaying = true;

            // Timer countdown
            timerInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Mole pop-up logic
            showMole();
            moleInterval = setInterval(() => {
                showMole();
            }, 850); // Moles change position every 0.85 seconds
        }

        function endGame() {
            clearInterval(timerInterval);
            clearInterval(moleInterval);
            isPlaying = false;
            
            if (currentMole) currentMole.classList.remove('up');
            startBtn.disabled = false;
            startBtn.textContent = '再玩一次';
            
            // Delay alert slightly so the UI timer reaches 0 first
            setTimeout(() => {
                alert(`遊戲結束！你的總得分是：${score} 分！`);
            }, 100);
        }
    </script>
</body>
</html>
